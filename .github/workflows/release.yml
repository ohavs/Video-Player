name: Release

# Builds the Windows installer and publishes it as a GitHub Release. The app's
# updater reads that same release feed, so this workflow is the whole shipping
# process.
#
# To release: bump "version" in package.json and push. That is the entire
# procedure — no tag to create, no button to press.
#
# Every push to the trunk starts this workflow, but it stops within seconds
# unless the version in package.json has no release yet. That keeps releasing
# tied to the version number rather than to remembering to do something.

on:
  push:
    branches:
      - claude/youtube-like-video-player-ps611l
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "package.json is at $version"

      # The gate. A version that already has a tag has already shipped, so there
      # is nothing to build — without this, every unrelated push would try to
      # republish the current release and overwrite its installer.
      # A manual run ignores the gate so a failed build can be retried.
      - name: Decide whether to release
        id: gate
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing -and "${{ github.event_name }}" -ne "workflow_dispatch") {
            "release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "$tag is already released — nothing to do. Bump the version in package.json to ship again."
          } else {
            "release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Releasing $tag"
          }

      # Created here, before the build, and deliberately not left to
      # electron-builder.
      #
      # electron-builder uploads its artifacts concurrently, and each upload
      # looks for the release and creates it when absent. When two of them look
      # at the same moment both create it: one wins, the other gets
      # "422 already_exists" and takes the whole publish down with it. That is
      # how v0.4.0 shipped carrying its installer but not latest.yml — a release
      # the updater cannot see at all.
      #
      # A release that already exists is never raced for. This also creates the
      # tag, so there is no separate tagging step.
      - name: Create the release
        if: steps.gate.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists, reusing it"
          } else {
            gh release create $tag --title "${{ steps.version.outputs.value }}" --target $env:GITHUB_SHA --generate-notes
            if ($LASTEXITCODE -ne 0) {
              # Generated notes need a previous tag to diff against; the very
              # first release has none.
              gh release create $tag --title "${{ steps.version.outputs.value }}" --target $env:GITHUB_SHA --notes "Automated release."
            }
            if ($LASTEXITCODE -ne 0) { throw "could not create $tag" }
            Write-Host "Created $tag"
          }

      - name: Install dependencies
        if: steps.gate.outputs.release == 'true'
        run: npm ci

      # The bundled ffmpeg arrives through ffmpeg-static's install script rather
      # than the lockfile, so a silent download failure would otherwise only
      # surface as an app that cannot trim.
      - name: Verify the bundled video engine
        if: steps.gate.outputs.release == 'true'
        shell: pwsh
        run: |
          $ffmpeg = node -p "require('ffmpeg-static') || ''"
          if (-not $ffmpeg -or -not (Test-Path $ffmpeg)) {
            Write-Error "ffmpeg-static did not produce a binary — the installer would ship without trim support."
            exit 1
          }
          $size = [math]::Round((Get-Item $ffmpeg).Length / 1MB, 1)
          Write-Host "ffmpeg present at $ffmpeg ($size MB)"
          & $ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Build and publish installer
        id: publish
        if: steps.gate.outputs.release == 'true'
        continue-on-error: true
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploading a ~120MB asset is the one step here likely to fail for reasons
      # that have nothing to do with the code. Re-running attaches whatever is
      # missing to the release that already exists, so it is safe to repeat.
      - name: Retry publishing
        if: steps.gate.outputs.release == 'true' && steps.publish.outcome == 'failure'
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The check that would have caught v0.4.0. A release carrying the
      # installer but not latest.yml is invisible to the updater: the app finds
      # nothing, says it is up to date, and the version sits unnoticed. Shipping
      # that silently is the exact failure this workflow exists to prevent, so
      # the outcome is asserted rather than assumed.
      - name: Verify the release is complete
        if: steps.gate.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $attached = @(gh release view $tag --json assets --jq '.assets[].name')
          Write-Host "Attached to $tag :"
          $attached | ForEach-Object { Write-Host "  $_" }

          $required = @("latest.yml", "VideoPlayer-Setup-${{ steps.version.outputs.value }}.exe")
          $missing = $required | Where-Object { $attached -notcontains $_ }

          if ($missing) {
            Write-Error "$tag is missing: $($missing -join ', '). The updater would never see this release."
            exit 1
          }
          Write-Host "$tag is complete and visible to the updater."
